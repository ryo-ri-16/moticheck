services:
  - type: web
    name: moticheck
    env: docker
    dockerfilePath: ./Dockerfile

    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: moticheck-db
          property: connectionString

    buildCommand: |
      bundle install &&
      bundle exec rails assets:precompile &&
      bundle exec rails db:create &&
      bundle exec rails db:migrate

    startCommand: |
      bundle exec rails db:migrate &&
      bundle exec rails server -b 0.0.0.0 -p $PORT

  - type: cron
    name: notification-job
    env: ruby
    buildCommand: "bundle install"
    startCommand: "bundle exec rails runner 'CreateNotificationsJob.perform_now'"
    schedule: "*/5 * * * *"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: moticheck-db
          property: connectionString

  - type: cron
    name: generate-lists-job
    env: ruby
    schedule: "0 15 * * *"
    buildCommand: "bundle install"
    startCommand: "bundle exec rails runner 'ListGenerator.run'"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: moticheck-db
          property: connectionString

databases:
  - name: moticheck-db
    databaseName: moticheck_production
    user: moticheck_user